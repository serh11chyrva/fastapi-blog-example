[project]
name = "fastapi-blog-example"
version = "0.1.0"
description = "A FastAPI and React microblogging demo"
readme = "README.md"
authors = [
    { name = "serh11chyrva", email = "chirva2428@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.2.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.40.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.0",
    "pymongo>=4.13.0",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
]

[project.scripts]
fastapi-blog-example = "backend.main:main"

[tool.uv.build-backend]
module-name = "backend"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
