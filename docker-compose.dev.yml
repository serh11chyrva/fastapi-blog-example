services:
  api:
    image: ${COMPOSE_PROJECT_NAME}-api-dev:local
    pull_policy: never
    build:
      target: development
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src/backend"]
    environment:
      PYTHONPATH: /app/src
      APP_ORIGIN: ${FRONTEND_DEV_ORIGIN:-http://localhost:5173}
      APP_ADDITIONAL_ORIGIN: ${APP_ORIGIN:-http://localhost:${API_PORT:-8080}}
    volumes:
      - ./src/backend:/app/src/backend:ro

  frontend-dev:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: development
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: ${FRONTEND_DEV_POLLING:-true}
    volumes:
      - ./src/frontend/src:/app/src:ro
    depends_on:
      - api
