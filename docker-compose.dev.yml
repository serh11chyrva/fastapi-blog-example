services:
  api:
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment:
      PYTHONPATH: /app/src
      APP_ORIGIN: ${FRONTEND_DEV_ORIGIN:-http://localhost:5173}
    volumes:
      - ./src:/app/src

  frontend-dev:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile.dev
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  frontend_node_modules:
